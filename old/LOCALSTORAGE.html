
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
#app { padding: 1rem 0; font-family: var(--font-sans); }
.header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
.tab-badge { font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: var(--border-radius-md); }
.peers-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; font-size: 12px; color: var(--color-text-secondary); }
.peer-pill { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 0.5px solid var(--color-border-secondary); }
.input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
.input-row input { flex: 1; }
.items-list { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; min-height: 80px; }
.item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 14px; }
.item:last-child { border-bottom: none; }
.item-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.item-text { flex: 1; color: var(--color-text-primary); }
.item-meta { font-size: 11px; color: var(--color-text-secondary); }
.item-del { display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--color-text-secondary); padding: 2px; font-size: 18px; line-height: 1; }
.item-del:hover { color: #e24b4a; }
.empty { padding: 1.5rem; text-align: center; font-size: 13px; color: var(--color-text-secondary); }
.event-log { margin-top: 1rem; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); max-height: 120px; overflow-y: auto; }
.log-entry { padding: 5px 12px; font-size: 12px; font-family: var(--font-mono); color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
.log-entry:last-child { border-bottom: none; }
.log-entry.self { color: var(--color-text-info); }
.transport-note { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 1rem; padding: 6px 10px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); }
</style>

<div id="app">
  <h2 class="sr-only">localStorage shared array demo for FileMaker WebViewers</h2>

  <div class="header">
    <span id="tab-badge" class="tab-badge">tab --</span>
    <span id="status" class="status" style="font-size:12px; color:var(--color-text-secondary)">active</span>
  </div>

  <div class="transport-note" id="transport-note">detecting transport...</div>

  <div class="peers-row" id="peers-row">
    <span>peers:</span>
    <span id="no-peers">none yet -- open another webviewer!</span>
  </div>

  <div class="input-row">
    <input type="text" id="new-item" placeholder="type something and add to the shared array..." />
    <button id="add-btn">add</button>
  </div>

  <div class="items-list" id="list"></div>
  <div class="event-log" id="log"></div>
</div>

<script>
const COLORS = ['#185FA5','#1D9E75','#BA7517','#993556','#533AB7','#993C1D','#3B6D11'];
const TAB_ID = Math.random().toString(36).slice(2, 7);
const COLOR = COLORS[Math.floor(Math.random() * COLORS.length)];
const LS_MSG_KEY = 'fmwv_bus_msg';
const LS_ARRAY_KEY = 'fmwv_shared_array';

document.getElementById('tab-badge').textContent = 'tab ' + TAB_ID;
document.getElementById('tab-badge').style.background = COLOR + '22';
document.getElementById('tab-badge').style.color = COLOR;
document.getElementById('add-btn').onclick = addItem;

let sharedArray = [];
let peers = {};

// detect best available transport
let transport = 'localstorage';
try {
  const bc = new BroadcastChannel('_test');
  bc.close();
  transport = 'broadcastchannel';
} catch(e) {}

const note = document.getElementById('transport-note');
note.textContent = 'transport: ' + transport + (transport === 'broadcastchannel' ? ' (hosted/same-origin)' : ' (localStorage, works on file://)');

function logEvent(msg, isSelf) {
  const log = document.getElementById('log');
  const el = document.createElement('div');
  el.className = 'log-entry' + (isSelf ? ' self' : '');
  const t = new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  el.textContent = t + '  ' + msg;
  log.prepend(el);
  while (log.children.length > 30) log.removeChild(log.lastChild);
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (sharedArray.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'shared array is empty';
    list.appendChild(empty);
    return;
  }
  sharedArray.forEach(function(item, i) {
    const div = document.createElement('div');
    div.className = 'item';
    const dot = document.createElement('span');
    dot.className = 'item-dot';
    dot.style.background = item.color;
    const text = document.createElement('span');
    text.className = 'item-text';
    text.textContent = item.text;
    const meta = document.createElement('span');
    meta.className = 'item-meta';
    meta.textContent = 'by tab ' + item.tabId;
    const del = document.createElement('button');
    del.className = 'item-del';
    del.setAttribute('aria-label', 'delete');
    del.innerHTML = '<i class="ti ti-x" aria-hidden="true"></i>';
    del.onclick = function() { deleteItem(i); };
    div.appendChild(dot); div.appendChild(text); div.appendChild(meta); div.appendChild(del);
    list.appendChild(div);
  });
}

function renderPeers() {
  const row = document.getElementById('peers-row');
  row.querySelectorAll('.peer-pill').forEach(function(p) { p.remove(); });
  const noPeers = document.getElementById('no-peers');
  const ids = Object.keys(peers).filter(function(k) { return !k.endsWith('_ts'); });
  if (ids.length === 0) {
    if (!noPeers.parentNode) row.appendChild(noPeers);
  } else {
    if (noPeers.parentNode) noPeers.parentNode.removeChild(noPeers);
    ids.forEach(function(id) {
      const pill = document.createElement('span');
      pill.className = 'peer-pill';
      pill.textContent = 'tab ' + id;
      pill.style.color = peers[id];
      pill.style.borderColor = peers[id] + '66';
      row.appendChild(pill);
    });
  }
}

// --- messaging layer: works with both transports ---
let bc = null;
if (transport === 'broadcastchannel') {
  bc = new BroadcastChannel('fmwv_shared_array_poc');
  bc.onmessage = function(e) { handleMessage(e.data); };
}

function broadcast(msg) {
  if (transport === 'broadcastchannel') {
    bc.postMessage(msg);
  } else {
    // localStorage trick: write a timestamped envelope so even same-value writes fire the event
    const envelope = { msg: msg, ts: Date.now() };
    localStorage.setItem(LS_MSG_KEY, JSON.stringify(envelope));
  }
}

window.addEventListener('storage', function(e) {
  if (e.key === LS_MSG_KEY && e.newValue) {
    try {
      const envelope = JSON.parse(e.newValue);
      handleMessage(envelope.msg);
    } catch(err) {}
  }
});

function handleMessage(msg) {
  if (!msg || msg.from === TAB_ID) return;

  if (msg.type === 'SYNC_REQ') {
    peers[msg.from] = msg.color;
    renderPeers();
    broadcast({ type: 'SYNC_RES', array: sharedArray, from: TAB_ID, color: COLOR });
    logEvent('in  new peer tab ' + msg.from + ' joined', false);
  }
  if (msg.type === 'SYNC_RES') {
    if (!peers[msg.from]) { peers[msg.from] = msg.color; renderPeers(); }
    if (msg.array.length > sharedArray.length) {
      sharedArray = msg.array.slice();
      renderList();
      logEvent('in  synced array from tab ' + msg.from, false);
    }
  }
  if (msg.type === 'ADD') {
    if (!peers[msg.from]) { peers[msg.from] = msg.item.color; renderPeers(); }
    if (!sharedArray.find(function(i) { return i.id === msg.item.id; })) {
      sharedArray.push(msg.item);
      renderList();
      logEvent('in  ADD "' + msg.item.text + '" from tab ' + msg.from, false);
    }
  }
  if (msg.type === 'DELETE') {
    const before = sharedArray.length;
    sharedArray = sharedArray.filter(function(i) { return i.id !== msg.itemId; });
    if (sharedArray.length !== before) {
      renderList();
      logEvent('in  DELETE from tab ' + msg.from, false);
    }
  }
  if (msg.type === 'HEARTBEAT') {
    if (!peers[msg.from]) { peers[msg.from] = msg.color; renderPeers(); }
    peers[msg.from + '_ts'] = Date.now();
  }
}

function addItem() {
  const input = document.getElementById('new-item');
  const text = input.value.trim();
  if (!text) return;
  const item = { id: Date.now() + Math.random(), text: text, tabId: TAB_ID, color: COLOR };
  sharedArray.push(item);
  renderList();
  broadcast({ type: 'ADD', item: item, from: TAB_ID });
  logEvent('out ADD "' + text + '"', true);
  input.value = '';
}

function deleteItem(index) {
  const item = sharedArray[index];
  if (!item) return;
  sharedArray.splice(index, 1);
  renderList();
  broadcast({ type: 'DELETE', itemId: item.id, from: TAB_ID });
  logEvent('out DELETE "' + item.text + '"', true);
}

document.getElementById('new-item').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') addItem();
});

setInterval(function() {
  broadcast({ type: 'HEARTBEAT', from: TAB_ID, color: COLOR });
  const now = Date.now();
  let changed = false;
  Object.keys(peers).filter(function(k) { return !k.endsWith('_ts'); }).forEach(function(k) {
    const ts = peers[k + '_ts'];
    if (ts && now - ts > 4000) {
      delete peers[k]; delete peers[k + '_ts'];
      changed = true;
      logEvent('peer tab ' + k + ' left', false);
    }
  });
  if (changed) renderPeers();
}, 1500);

setTimeout(function() {
  broadcast({ type: 'SYNC_REQ', from: TAB_ID, color: COLOR });
}, 300);

logEvent('tab ' + TAB_ID + ' started', true);
renderList();
</script>
